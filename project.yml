name: TunnelOne
options:
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_HARDENED_RUNTIME: YES
    VERSION_NAME: "0.3.0"
    VERSION_ID: "10"
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/Sources/Shared/Logging
      - $(SRCROOT)/Sources/WireGuardApp/ZipArchive/3rdparty/minizip
      - $(SRCROOT)/Sources/WireGuardApp/UI/macOS/View
      - $(SRCROOT)/build/bridge
    SWIFT_PRECOMPILE_BRIDGING_HEADER: NO
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "HAVE_ARC4RANDOM_BUF"]
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  TunnelOne:
    type: application
    platform: macOS
    sources:
      - path: Sources/WireGuardApp
        excludes: ["UI/iOS", "UI/macOS/LoginItemHelper", "Config", "Resources/TunnelOneUI"]
      - path: Sources/WireGuardApp/Resources/TunnelOneUI
        type: folder
        buildPhase: resources
      - path: Sources/Shared
        excludes: ["Logging/test_ringlogger.c"]
      - path: Sources/WireGuardKit
        excludes: ["WireGuardAdapter.swift", "DNSResolver.swift", "PacketTunnelSettingsGenerator.swift", "IPAddress+AddrInfo.swift", "Array+ConcurrentMap.swift"]
      - path: Sources/WireGuardKitC
      - path: Sources/TunnelOneShared
      - path: ThirdParty
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID_MACOS)
        PRODUCT_MODULE_NAME: WireGuard
        SWIFT_OBJC_BRIDGING_HEADER: Sources/WireGuardApp/WireGuard-Bridging-Header.h
        INFOPLIST_FILE: Sources/WireGuardApp/UI/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/WireGuardApp/UI/macOS/WireGuard.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE)
        OTHER_LDFLAGS: ["$(inherited)", "-lz"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: WireGuardNetworkExtension
        embed: true
      - target: TunnelOneLoginItemHelper
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
      - sdk: NetworkExtension.framework
      - sdk: ServiceManagement.framework
      - sdk: SystemExtensions.framework
      - sdk: WebKit.framework
  WireGuardNetworkExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/WireGuardNetworkExtension
      - path: Sources/TunnelOneConnectivity
      - path: Sources/SystemExtension
      - path: Sources/Shared
        excludes: ["Logging/test_ringlogger.c"]
      - path: Sources/WireGuardKit
      - path: Sources/WireGuardKitC
      - path: Sources/TunnelOneShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID_MACOS).network-extension
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: TunnelOneNetworkExtension
        SYSTEM_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/WireGuardNetworkExtension/WireGuardNetworkExtension-Bridging-Header.h
        INFOPLIST_FILE: Sources/WireGuardNetworkExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/WireGuardNetworkExtension/WireGuardNetworkExtension_macOS.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(EXTENSION_PROFILE)
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/build/bridge"]
        OTHER_LDFLAGS: ["$(inherited)", "-lwg-go", "-lresolv"]
    dependencies:
      - sdk: NetworkExtension.framework
    postBuildScripts:
      - name: Embed proxy runtime
        script: |
          set -eu
          destination="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/MacOS"
          mkdir -p "$destination"
          cp "$SRCROOT/build/core/mihomo" "$destination/mihomo"
          cp "$SRCROOT/build/core/tunnelone-core-launcher" "$destination/tunnelone-core-launcher"
          if [ "$CODE_SIGNING_ALLOWED" = YES ]; then
            /usr/bin/codesign --force --options runtime --timestamp --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$destination/mihomo"
            /usr/bin/codesign --force --options runtime --timestamp --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$destination/tunnelone-core-launcher"
          fi
  TunnelOneLoginItemHelper:
    type: application
    platform: macOS
    sources:
      - path: Sources/WireGuardApp/UI/macOS/LoginItemHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID_MACOS).login-item-helper
        INFOPLIST_FILE: Sources/WireGuardApp/UI/macOS/LoginItemHelper/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/WireGuardApp/UI/macOS/LoginItemHelper/LoginItemHelper.entitlements
        SKIP_INSTALL: YES
schemes:
  TunnelOne:
    build:
      targets:
        TunnelOne: all
