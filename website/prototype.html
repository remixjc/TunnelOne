  #tunnel-one-prototype .to-main{padding:23px 18px}

  #tunnel-one-prototype .to-title-status{font-size:11px}

  #tunnel-one-prototype .to-form-grid{grid-template-columns:1fr}

  #tunnel-one-prototype .to-button,#tunnel-one-prototype .to-small-button,#tunnel-one-prototype .to-nav-item,#tunnel-one-prototype .to-icon-button,#tunnel-one-prototype .to-tab{min-height:44px}
  #tunnel-one-prototype .to-icon-button{min-width:44px}

  #tunnel-one-prototype .to-switch{width:44px;height:30px}
  #tunnel-one-prototype .to-switch span{inset:4px 5px}
}
</style>
<script>
(() => {
  const root = document.getElementById('tunnel-one-prototype');
  const main = root.querySelector('#to-main');
  const sheetHost = root.querySelector('#to-sheet-host');
  const demoKey = 'DEMO_PRIVATE_KEY_NOT_FOR_REAL_CONNECTION';
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const esc = text => String(text ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const button = (text, action, type = '', extra = '') => `<button type="button" class="to-button cursor-interaction ${type}" data-action="${action}" ${extra}>${text}</button>`;
  const toggle = (key, checked, label, disabled = false) => `<label class="to-switch cursor-interaction"><input type="checkbox" role="switch" data-toggle="${key}" aria-label="${label}" ${checked?'checked':''} ${disabled?'disabled':''}><span aria-hidden="true"></span></label>`;
  const profiles = [
    {id:'home',name:'Home WireGuard',note:'日常上网',address:'10.8.0.2/24',dns:'114.114.114.114, 1.1.1.1',mtu:'1420',listen:'自动',proxy:true,source:'builtin',failure:'disconnect',ondemand:false,wifi:true,ethernet:false,ssidMode:'all',ssids:'',peers:[{endpoint:'192.0.2.20:51820',allowed:'0.0.0.0/0',keepalive:'25',publicKey:'DEMO_PUBLIC_KEY_4bNf…q9M=',psk:true}]},
    {id:'office',name:'Office Private',note:'工作内网',address:'10.20.0.3/24',dns:'10.20.0.1',mtu:'自动',listen:'自动',proxy:false,source:'builtin',failure:'disconnect',ondemand:false,wifi:true,ethernet:true,ssidMode:'exclude',ssids:'Office-WiFi',peers:[{endpoint:'vpn.example.com:51820',allowed:'10.20.0.0/16',keepalive:'25',publicKey:'DEMO_PUBLIC_KEY_7aJk…v2E=',psk:false}]},
    {id:'travel',name:'Travel',note:'外出备用',address:'10.9.0.4/24',dns:'1.1.1.1',mtu:'自动',listen:'自动',proxy:true,source:'local',failure:'keep',ondemand:false,wifi:true,ethernet:false,ssidMode:'all',ssids:'',peers:[{endpoint:'travel.example.com:51820',allowed:'0.0.0.0/0, ::/0',keepalive:'25',publicKey:'DEMO_PUBLIC_KEY_5cHr…m8L=',psk:true}]}
  ];
  const state = {
    page:'tunnel',tab:'overview',selected:'home',active:null,phase:'idle',step:-1,appliedProxy:false,
    failure:null,scenario:'normal',modal:null,logs:[],logFilter:'all',proxyMode:'rule',node:'auto',
    localHost:'127.0.0.1',localPort:'7890',localProtocol:'mixed',autoLaunch:true,
    login:false,menubar:true,closeBackground:true,updates:true,authorized:true,
    demandBlocked:false,showKey:false,editorMode:'form',draftPeers:null,updated:'今天 18:17',
    editId:null,modalError:'',restoreMessage:'',density:'comfortable',roundness:12
  };
  let runToken = 0, toastTimer = null, nextId = 1;
  const fallbackProfile=JSON.parse(JSON.stringify(profiles[0]));
  const current = () => profiles.find(p => p.id === state.selected) || profiles[0] || fallbackProfile;
  const getProfile = id => profiles.find(p => p.id === id);
  const busy = () => ['connecting','applying','reasserting'].includes(state.phase);
  const sourceName = p => p.source === 'local' ? '本机代理 · Clash Party' : '内置代理 · 日常分流';
  function restoreSaved(saved) {
    const a = saved?.modelContent, b = saved?.privateContent;
    if (a?.product !== 'TunnelOne') return;
    if (['tunnel','proxy','logs','settings'].includes(a.page)) state.page = a.page;
    if (getProfile(a.selectedTunnel)) state.selected = a.selectedTunnel;
    if (typeof a.bringProxy === 'boolean') current().proxy = a.bringProxy;
    if (['overview','configuration','ondemand'].includes(b?.tab)) state.tab = b.tab;
    if (['comfortable','compact'].includes(b?.density)) state.density = b.density;
  }
  restoreSaved(window.openai?.widgetState);
  function persist() {
    const snapshot = {
      modelContent:{product:'TunnelOne',page:state.page,selectedTunnel:state.selected,bringProxy:current()?.proxy ?? false,proxySource:current()?.source ?? 'builtin',connectionState:state.phase,scenario:state.scenario},
      privateContent:{tab:state.tab,density:state.density}
    };
    if (window.openai?.setWidgetState) window.openai.setWidgetState(snapshot).catch(() => {});
  }
  window.addEventListener('openai:set_globals', event => {
    const saved = event.detail?.globals?.widgetState;
    if (saved) {
      const before=JSON.stringify([state.page,state.selected,state.tab,state.density,current().proxy]);
      restoreSaved(saved);
      const after=JSON.stringify([state.page,state.selected,state.tab,state.density,current().proxy]);
      if(before!==after)render();
    }
  });
  function icons() { if (globalThis.lucide?.createIcons) lucide.createIcons({attrs:{width:17,height:17}}); }
  function toast(text) {
    const el = root.querySelector('#to-toast');
    el.textContent = text; el.hidden = false; clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {el.hidden=true;},3200);
  }
  function log(level,category,message) {
    const time = new Date().toLocaleTimeString('zh-CN',{hour12:false});
    state.logs.unshift({time,level,category,message});
    state.logs = state.logs.slice(0,40);
  }
  function showModal(name) { state.modal=name; state.modalError=''; renderSheet(); icons(); }
  function closeModal() { state.modal=null; state.modalError=''; renderSheet(); root.querySelector('.to-window').style.minHeight=''; }
  function switchPage(page) { state.page=page;closeModal();render();persist(); }
  function configText(p) {
    const peerText = p.peers.map(x=>`[Peer]\nPublicKey = ${x.publicKey}\n${x.psk?'PresharedKey = DEMO_PRESHARED_KEY\n':''}Endpoint = ${x.endpoint}\nAllowedIPs = ${x.allowed}\nPersistentKeepalive = ${x.keepalive || '0'}`).join('\n\n');
    return `# 隧行交互原型 · 演示配置，不能用于真实连接\n[Interface]\nPrivateKey = ${demoKey}\nAddress = ${p.address}\nDNS = ${p.dns}\n${p.mtu!=='自动'?'MTU = '+p.mtu+'\n':''}${p.listen!=='自动'?'ListenPort = '+p.listen+'\n':''}\n${peerText}`;
  }
  function header(title,subtitle,actions='') {
    return `<div class="to-page-top"><div><h1>${esc(title)}</h1><p class="to-subtitle">${subtitle}</p></div><div class="to-row">${actions}</div></div>`;
  }
  function statusMarkup(p) {
    const own = state.active===p.id, connected=own&&state.phase==='connected', progress=own&&busy();
    let title='隧道未连接', detail='准备就绪，连接后自动处理网络与代理。', cls='', glyph='shield';
    if (connected) {
      title=state.appliedProxy?'隧道与代理已连接':'WireGuard 已连接';
      detail=state.appliedProxy?'国内直连与国外代理均可用。':'当前按 WireGuard 配置访问网络。';
      cls=state.failure?'warn':'good';glyph=state.failure?'shield-alert':'shield-check';
    }
    if (progress) {
      title=state.phase==='applying'?'正在更新代理':state.phase==='reasserting'?'正在恢复网络连接':'正在连接';
      detail=stepLabels(p)[Math.max(0,state.step)] || '正在准备网络配置…';glyph='loader-circle';
    }
    if (!own&&state.active) detail=`${esc(getProfile(state.active)?.name)} 正在连接或运行。`;
    return `<div class="to-status-panel" aria-live="polite"><div class="to-status-icon ${cls}">${icon(glyph)}</div><div><div class="to-status-title">${title}</div><div class="to-status-detail">${detail}</div></div><div class="to-status-trailing">${connected?'<span class="to-pill good">握手正常</span><p style="margin-top:6px">上次握手 · 刚刚</p>':'<span class="to-pill">本地配置</span>'}</div></div>`;
  }
  function stepLabels(p) {
    return p.proxy?['建立隧道','确认握手','准备代理','应用配置','验证网络']:['建立隧道','确认握手','验证网络'];
  }
  function tunnelPage() {
    const p=current(); if(!profiles.length) return `${header('隧道','添加你的第一个 WireGuard 隧道。',button(icon('plus')+'添加隧道','add-menu','primary'))}<div class="to-empty">${icon('shield')}<p>还没有隧道</p></div>`;
    const own=state.active===p.id, connected=own&&state.phase==='connected', progress=own&&busy();
    const connectLabel=progress?'取消连接':connected?'断开连接':'连接隧道';
    const tabs=[['overview','概览'],['configuration','隧道配置'],['ondemand','按需连接']];
    let html=header(p.name,`${esc(p.note)} <span style="margin:0 5px">·</span> WireGuard`,button(icon(connected?'square':'power')+connectLabel,'connect',connected?'to-main-connect':'primary to-main-connect')+`<button type="button" class="to-icon-button cursor-interaction" data-action="tunnel-menu" aria-label="隧道操作">${icon('ellipsis')}</button>`);
    html+=`<div class="to-tabs" role="tablist" aria-label="隧道详情">${tabs.map(([id,label])=>`<button type="button" class="to-tab cursor-interaction ${state.tab===id?'active':''}" role="tab" aria-selected="${state.tab===id}" aria-controls="to-tab-content" data-tab="${id}" id="to-tab-${id}">${label}</button>`).join('')}</div><div id="to-tab-content" role="tabpanel" aria-labelledby="to-tab-${state.tab}">`;
    if(state.tab==='overview') {
      html+=statusMarkup(p);
      if(progress) html+=`<div class="to-progress" aria-label="连接进度">${stepLabels(p).map((x,i)=>`<div class="to-step ${i<state.step?'done':i===state.step?'current':''}">${x}</div>`).join('')}</div>`;
      if(state.failure&&(!state.active||own)) html+=failureNotice();
      html+=`<section class="to-section"><div class="to-section-heading"><div><h3>${icon('shuffle')}连接时带入代理</h3><p class="to-subtitle">为这个隧道单独设置，连接时自动生效。</p></div>${toggle('proxy',p.proxy,'连接时带入代理',progress)}</div><div class="to-section-content">`;
      if(p.proxy) html+=`<div class="to-profile-line" style="margin-top:0"><label class="to-field" style="flex:1">使用代理配置<select class="to-select" data-field="source" aria-label="使用代理配置"><option value="builtin" ${p.source==='builtin'?'selected':''}>内置代理 · 日常分流</option><option value="local" ${p.source==='local'?'selected':''}>本机代理 · Clash Party</option></select></label><button class="to-text-button cursor-interaction" data-page="proxy" style="margin-top:23px">管理配置</button></div><div class="to-connection-flow"><span class="to-flow-item">${icon('laptop')}应用</span>${icon('chevron-right')}<span class="to-flow-item on">${icon('shuffle')}规则分流</span>${icon('chevron-right')}<span class="to-flow-item on">${icon('shield')}WireGuard</span>${icon('chevron-right')}<span class="to-flow-item">${icon('globe')}互联网</span></div><details class="to-advanced"><summary class="cursor-interaction">代理失败时的处理</summary><div><label class="to-field"><select class="to-select" data-field="failure" aria-label="代理失败时的处理"><option value="disconnect" ${p.failure==='disconnect'?'selected':''}>断开隧道并恢复原网络（推荐）</option><option value="keep" ${p.failure==='keep'?'selected':''}>仅保留 WireGuard 隧道</option></select></label></div></details>`;
      else html+=`<div class="to-proxy-off">仅使用 WireGuard，不启动代理，也不改变现有系统代理。</div><div class="to-connection-flow"><span class="to-flow-item">${icon('laptop')}应用</span>${icon('chevron-right')}<span class="to-flow-item on">${icon('shield')}WireGuard</span>${icon('chevron-right')}<span class="to-flow-item">${icon('globe')}互联网</span></div>`;
      html+=`<div class="to-footnote">${icon('undo-2')}<span>断开时恢复连接前的代理配置。系统授权仅在首次安装时申请。</span></div></div></section>`;
      if(own&&state.phase==='connected'&&p.proxy!==state.appliedProxy)html+=`<div class="to-notice">${icon('info')}<div>代理开关已保存，下次连接生效。<div class="to-row">${button('立即应用','apply-proxy')}</div></div></div>`;
      html+=`<dl class="to-details"><div><dt>本地地址</dt><dd class="to-mono">${esc(p.address)}</dd></div><div><dt>服务器</dt><dd class="to-mono">${esc(p.peers[0]?.endpoint||'未配置')}</dd></div><div><dt>DNS 服务器</dt><dd class="to-mono">${esc(p.dns)}</dd></div><div><dt>路由范围</dt><dd>${p.peers[0]?.allowed.includes('0.0.0.0/0')?'IPv4 全局流量':esc(p.peers[0]?.allowed||'未配置')}${p.peers[0]?.allowed.includes('::/0')?' · 包含 IPv6':''}</dd></div></dl>`;
      if(connected)html+=`<dl class="to-metrics"><div><dt>已接收</dt><dd>12.4 MB</dd></div><div><dt>已发送</dt><dd>2.1 MB</dd></div><div><dt>当前出口</dt><dd>${state.appliedProxy?'隧道 + 代理':'仅隧道'}</dd></div></dl>`;
      else html+=`<div class="to-row" style="justify-content:space-between;margin-top:22px"><span class="to-caption">配置更新 · 今天</span><button class="to-text-button cursor-interaction" data-tab="configuration">查看完整配置 ${icon('arrow-up-right')}</button></div>`;
    } else if(state.tab==='configuration') html+=configurationPage(p);
    else html+=demandPage(p);
    return html+'</div>';
  }
  function failureNotice() {
    const kept=state.active&&state.phase==='connected';
    return `<div class="to-notice ${kept?'':'error'}" role="alert" style="margin-bottom:18px">${icon(kept?'triangle-alert':'circle-alert')}<div><strong>${state.failure==='handshake'?'WireGuard 握手超时':'代理暂时不可用'}</strong><p>${kept?'已按你的设置保留 WireGuard，当前不使用代理。':'已自动停止本次连接，并恢复连接前的网络与代理。'}</p><div class="to-row">${button(kept?'重试代理':'重新连接',kept?'retry-proxy':'retry')}${button('查看日志','view-logs','ghost')}</div></div></div>`;
  }
  function configurationPage(p) {
    return `<div class="to-row" style="justify-content:space-between;margin-bottom:16px"><span class="to-caption">标准 WireGuard 配置，可导入、编辑与导出。</span>${button(icon('pencil')+'编辑配置','edit')}</div><section class="to-section" style="margin-top:0"><div class="to-section-heading"><h3>${icon('laptop')}接口</h3><span class="to-pill">WireGuard</span></div><div class="to-section-content"><dl class="to-details" style="margin-top:0"><div class="to-span-all"><dt>公钥</dt><dd class="to-key"><code>${state.showKey?'DEMO_PUBLIC_KEY_4bNfR2q9M_NOT_FOR_CONNECTION':'4bNfR2…q9M=（演示）'}</code><button class="to-icon-button cursor-interaction" data-action="copy-public" aria-label="复制演示公钥">${icon('copy')}</button></dd></div><div><dt>私钥</dt><dd>•••••••••••• ${button(state.showKey?'隐藏':'查看','show-key','ghost')}</dd></div><div><dt>监听端口</dt><dd>${esc(p.listen)}</dd></div><div><dt>IP 地址</dt><dd class="to-mono">${esc(p.address)}</dd></div><div><dt>MTU</dt><dd>${esc(p.mtu)}</dd></div><div class="to-span-all"><dt>DNS</dt><dd class="to-mono">${esc(p.dns)}</dd></div></dl>${state.showKey?'<p class="to-caption" style="margin-top:12px">演示私钥：DEMO_PRIVATE_KEY_NOT_FOR_REAL_CONNECTION</p>':''}</div></section>${p.peers.map((peer,i)=>`<section class="to-section"><div class="to-section-heading"><h3>${icon('server')}对端 ${i+1}</h3><span class="to-pill">${peer.psk?'已启用预共享密钥':'未使用预共享密钥'}</span></div><div class="to-section-content"><dl class="to-details" style="margin-top:0"><div><dt>端点</dt><dd class="to-mono">${esc(peer.endpoint)}</dd></div><div><dt>持续保活</dt><dd>${esc(peer.keepalive)} 秒</dd></div><div class="to-span-all"><dt>AllowedIPs</dt><dd class="to-mono">${esc(peer.allowed)}</dd></div><div class="to-span-all"><dt>对端公钥</dt><dd class="to-mono">${esc(peer.publicKey)}</dd></div></dl></div></section>`).join('')}<div class="to-row" style="justify-content:space-between;margin-top:18px">${button(icon('file-up')+'导出 .conf','export')}${button('复制配置','copy-config','ghost')}</div>`;
  }
  function demandPage(p) {

      title='一个入口，管理隧道与代理';body=`<div class="to-list">${[['shield','WireGuard 隧道','创建、复制、删除、启停；配置文本与表单编辑；多个对端、密钥、DNS、MTU、监听端口、AllowedIPs 与持续保活。'],['folder-open','配置与导入导出','.conf / .zip 导入；从文本创建；单个与全部导出；连接状态、握手与收发流量。'],['wifi','原生使用方式','Wi-Fi 与以太网按需连接、SSID 包含或排除、菜单栏操作、连接日志、登录启动。'],['shuffle','可选的代理联动','每隧道独立开关；内置规则代理或已有本机代理；连接后验证；失败策略；断开恢复；网络变化后重新应用。']].map(([glyph,name,desc])=>`<div class="to-list-row" style="align-items:flex-start">${icon(glyph)}<div><strong>${name}</strong><p>${desc}</p></div>`).join('')}</div><p class="to-caption" style="margin-top:13px">产品设计原型，所有连接、延迟与流量均为演示数据。</p>`;actions=button('完成','close-modal','primary');
    }
    sheetHost.innerHTML=`<div class="to-overlay"><section class="to-sheet" role="dialog" aria-modal="true" aria-labelledby="to-sheet-title"><div class="to-sheet-head"><h2 id="to-sheet-title">${title}</h2><button class="to-icon-button cursor-interaction" data-action="close-modal" aria-label="关闭弹窗">${icon('x')}</button></div><div class="to-sheet-body">${state.modalError?`<p class="to-sheet-error" role="alert">${esc(state.modalError)}</p>`:''}${body}</div><div class="to-sheet-actions">${actions}</div></section></div>`;
    requestAnimationFrame(()=>{
      const sheet=sheetHost.querySelector('.to-sheet');
      if(sheet)root.querySelector('.to-window').style.minHeight=(sheet.offsetHeight+105)+'px';
    });
  }
  function setIdle(message='') {
    runToken++;state.active=null;state.phase='idle';state.step=-1;state.appliedProxy=false;state.restoreMessage=message;
  }
  function disconnect(notify=true) {
    const active=getProfile(state.active);
    if(active){log('info','隧道',`已停止 ${active.name}`);if(state.appliedProxy||active.proxy)log('success','恢复','已恢复连接前的系统代理，并停止本次使用的代理服务。');}
    setIdle('已恢复连接前的网络代理');state.failure=null;render();persist();
    if(notify)toast('已断开隧道，原网络代理已恢复');
  }
  function requestConnect() {
    if(state.active===state.selected){disconnect();return;}
    if(state.active){showModal('switch-tunnel');return;}
    if(state.scenario==='first-run'||!state.authorized){showModal('permission');return;}
    startConnection();
  }
  function startConnection() {
    closeModal();const p=current();if(!p)return;
    if(!p.peers.length||!p.peers[0].endpoint){toast('请先填写对端地址');state.tab='configuration';render();return;}
    state.active=p.id;state.phase='connecting';state.step=0;state.failure=null;state.restoreMessage='';
    log('info','隧道',`开始连接 ${p.name}；已保存当前网络代理快照。`);
    const labels=stepLabels(p), token=++runToken;
    const advance=()=>{
      if(token!==runToken)return;
      if(state.step===1&&state.scenario==='handshake-fail'){failConnection('handshake');return;}
      if(p.proxy&&state.step===2&&state.scenario==='proxy-fail'){failConnection('proxy');return;}
      const step=state.step;
      if(step===0)log('success','隧道','WireGuard 网络接口已建立。');
      if(step===1)log('success','隧道','已收到对端握手响应。');
      if(p.proxy&&step===2)log('success','代理',p.source==='builtin'?'内置代理已就绪，已加载日常分流配置。':`${state.autoLaunch?'已在后台打开 Clash Party；':''}本机代理端口检测通过。`);
      if(p.proxy&&step===3)log('success','代理','代理已随当前隧道应用；HTTP / HTTPS / SOCKS 设置已确认。');
      if(step<labels.length-1){state.step++;render();setTimeout(advance,550);return;}
      state.phase='connected';state.step=labels.length;state.appliedProxy=p.proxy;
      log('success','隧道',p.proxy?'验证通过：国内直连、国外代理均可访问。':'验证通过：WireGuard 网络连接正常。');
      render();persist();toast(p.proxy?'已连接隧道并启用代理':'WireGuard 已连接');
    };
    render();persist();setTimeout(advance,450);
  }
  function failConnection(kind) {
    const p=getProfile(state.active);state.failure=kind;
    log('error',kind==='handshake'?'隧道':'代理',kind==='handshake'?'对端握手超时，隧道无法传输流量。':'代理服务未就绪，无法访问代理端口。');
    if(kind==='proxy'&&p.failure==='keep'){
      state.phase='connected';state.appliedProxy=false;state.step=-1;
      log('info','隧道','按失败策略保留 WireGuard，未应用代理。');
    } else {
      setIdle('连接失败，原网络代理已恢复');state.failure=kind;
      log('success','恢复','已停止本次隧道，恢复连接前的网络与代理。');
    }
    render();persist();
  }
  function applyProxy() {
    const p=current();if(state.active!==p.id||state.phase!=='connected')return;
    closeModal();state.phase='applying';const token=++runToken;
    render();
    setTimeout(()=>{
      if(token!==runToken)return;
      if(p.proxy&&state.scenario==='proxy-fail'){failConnection('proxy');return;}
      state.phase='connected';state.appliedProxy=p.proxy;state.failure=null;
      log('success','代理',p.proxy?'当前隧道的代理已启用并验证。':'已移除本次隧道代理，恢复连接前设置，WireGuard 保持连接。');
      render();persist();toast(p.proxy?'代理已应用，隧道保持连接':'代理已关闭，隧道保持连接');
    },850);
  }
  function openEditor(isNew=false) {
    closeModal();
    if(isNew) {
      const id='new-'+nextId++;
      state.editId=id;
      state.newDraft={id,name:'Untitled',note:'新建隧道',address:'10.10.0.2/24',dns:'1.1.1.1',mtu:'自动',listen:'自动',proxy:false,source:'builtin',failure:'disconnect',ondemand:false,wifi:true,ethernet:false,ssidMode:'all',ssids:'',peers:[{endpoint:'vpn.example.com:51820',allowed:'0.0.0.0/0',keepalive:'25',publicKey:'DEMO_PEER_PUBLIC_KEY',psk:false}]};
      profiles.push(state.newDraft);
    } else state.editId=current().id;
    state.editDraft=JSON.parse(JSON.stringify(getProfile(state.editId)));
    state.isNew=isNew;state.editorMode='form';state.rawDraft=null;state.draftPeers=null;showModal('edit');
  }
  function readPeerDraft() {
    const p=state.editDraft;const peers=state.draftPeers||p.peers;
    return peers.map((x,i)=>({...x,publicKey:root.querySelector('#to-peer-public-'+i)?.value??x.publicKey,endpoint:root.querySelector('#to-peer-endpoint-'+i)?.value??x.endpoint,allowed:root.querySelector('#to-peer-allowed-'+i)?.value??x.allowed,keepalive:root.querySelector('#to-peer-keepalive-'+i)?.value??x.keepalive,psk:root.querySelector('#to-peer-psk-'+i)?.checked??x.psk}));
  }
  function preserveEditor() {
    const p=state.editDraft;
    if(state.editorMode==='form'){
      for(const [key,id] of [['name','name'],['address','address'],['dns','dns'],['mtu','mtu'],['listen','listen']]) {
        const el=root.querySelector('#to-edit-'+id); if(el)p[key]=el.value;
      }
      state.draftPeers=readPeerDraft();
    } else state.rawDraft=root.querySelector('#to-raw-config')?.value||state.rawDraft;
  }
  function parseConfiguration(text,base) {
    if(!text.includes('[Interface]')||!text.includes('[Peer]'))throw Error('配置必须包含 [Interface] 和至少一个 [Peer]。');
    const value=(part,key,fallback='')=>part.match(new RegExp('^\\s*'+key+'\\s*=\\s*(.*)$','mi'))?.[1]?.trim()||fallback;
    const sections=text.split(/\[Peer\]/i), part=sections[0];
    return {...base,address:value(part,'Address',base.address),dns:value(part,'DNS',base.dns),mtu:value(part,'MTU','自动'),listen:value(part,'ListenPort','自动'),peers:sections.slice(1).map(s=>({publicKey:value(s,'PublicKey','DEMO_PEER_PUBLIC_KEY'),endpoint:value(s,'Endpoint'),allowed:value(s,'AllowedIPs'),keepalive:value(s,'PersistentKeepalive','0'),psk:!!value(s,'PresharedKey')}))};
  }
  function saveEditor() {
    try{
      const p=state.editDraft;
      if(state.editorMode==='text')Object.assign(p,parseConfiguration(root.querySelector('#to-raw-config').value,p));
      else {
        preserveEditor();
        if(!p.name.trim())throw Error('请填写隧道名称。');
        if(!p.address.trim())throw Error('请填写接口 IP 地址。');
        if(p.mtu!=='自动'&&(!/^\d+$/.test(p.mtu)||+p.mtu<576||+p.mtu>9000))throw Error('MTU 请输入 576–9000，或填写“自动”。');
        if(p.listen!=='自动'&&(!/^\d+$/.test(p.listen)||+p.listen>65535))throw Error('监听端口请输入 0–65535，或填写“自动”。');
        p.peers=state.draftPeers;
      }
      if(p.peers.some(x=>!x.endpoint||!x.allowed))throw Error('每个对端都需要填写端点和 AllowedIPs。');
      Object.assign(getProfile(state.editId),p);
      const reconnect=state.active===p.id;
      state.selected=p.id;state.isNew=false;state.page='tunnel';state.tab='configuration';closeModal();render();persist();toast('隧道配置已保存');
      if(reconnect)showModal('reconnect');
    }catch(e){state.modalError=e.message;renderSheet();icons();}
  }
  async function copyText(text,success) {
    try{await navigator.clipboard.writeText(text);toast(success);}catch{
      const area=root.querySelector('#to-export-text');
      if(area){area.focus();area.select();toast('文本已选中，可使用 ⌘C 复制');}else{showModal('export');icons();toast('已打开可复制的配置预览');}
    }
  }
  const actions = {
    'connect':requestConnect,'close-modal':()=>{
      if(state.modal==='edit'&&state.isNew){
        const index=profiles.findIndex(x=>x.id===state.editId);if(index>=0)profiles.splice(index,1);
        state.isNew=false;
      }
      closeModal();render();
    },
    'add-menu':()=>showModal('add-menu'),'tunnel-menu':()=>showModal('tunnel-menu'),
    'import':()=>showModal('import'),'paste-import':()=>showModal('paste-import'),
    'new-tunnel':()=>openEditor(true),'edit':()=>openEditor(false),'save-edit':saveEditor,
    'duplicate':()=>{const p=JSON.parse(JSON.stringify(current()));p.id='copy-'+nextId++;p.name+=' Copy';p.ondemand=false;profiles.push(p);state.selected=p.id;state.page='tunnel';closeModal();render();persist();toast('已复制隧道，按需连接默认关闭');},
    'do-import':()=>{
      const type=root.querySelector('input[name=to-import-type]:checked').value;
      const name=root.querySelector('#to-import-name').value.trim();
      if(!name){state.modalError='请填写隧道名称。';renderSheet();icons();return;}
      const count=type==='zip'?2:1;
      for(let i=0;i<count;i++){const p=JSON.parse(JSON.stringify(profiles[0]||current()));p.id='import-'+nextId++;p.name=name+(count>1?' '+(i+1):'');p.proxy=false;p.ondemand=false;p.note='已导入';profiles.push(p);if(i===0)state.selected=p.id;}
      closeModal();state.page='tunnel';state.tab='overview';render();persist();toast(`已导入 ${count} 个隧道，代理默认关闭`);
    },
    'do-paste-import':()=>{
      try{const name=root.querySelector('#to-paste-name').value.trim();if(!name)throw Error('请填写隧道名称。');const p=parseConfiguration(root.querySelector('#to-paste-config').value,JSON.parse(JSON.stringify(profiles[0]||current())));p.id='paste-'+nextId++;p.name=name;p.proxy=false;p.ondemand=false;profiles.push(p);state.selected=p.id;state.page='tunnel';state.tab='configuration';closeModal();render();persist();toast('已从文本创建隧道');}catch(e){state.modalError=e.message;renderSheet();icons();}
    },
    'delete':()=>showModal('delete'),'do-delete':()=>{
      const id=current().id;if(state.active===id)disconnect(false);profiles.splice(profiles.findIndex(x=>x.id===id),1);state.selected=profiles[0]?.id;closeModal();render();persist();toast('演示隧道已删除');
    },
    'export':()=>showModal('export'),'export-all':()=>showModal('export-all'),
    'copy-export':()=>copyText(root.querySelector('#to-export-text').value,'演示内容已复制'),
    'copy-config':()=>copyText(configText(current()),'演示配置已复制'),
    'copy-public':()=>copyText('DEMO_PUBLIC_KEY_NOT_FOR_REAL_CONNECTION','演示公钥已复制'),
    'show-key':()=>{state.showKey=!state.showKey;render();},
    'generate-key':()=>{const el=root.querySelector('#to-edit-private');if(el)el.value='DEMO_REGENERATED_KEY_'+nextId++;toast('已生成新的演示密钥');},
    'add-peer':()=>{preserveEditor();state.draftPeers.push({endpoint:'',allowed:'',keepalive:'25',publicKey:'',psk:false});renderSheet();icons();},
    'remove-peer':el=>{preserveEditor();state.draftPeers.splice(+el.dataset.peer,1);renderSheet();icons();},
    'import-proxy':()=>showModal('import-proxy'),'do-import-proxy':()=>{current().source='builtin';state.updated='刚刚';closeModal();state.page='proxy';render();persist();toast('已载入演示代理配置');},
    'update-proxy':()=>{state.updated='刚刚';log('success','代理','代理配置更新完成，保留当前节点选择。');render();toast('配置已更新（演示）');},
    'save-local':()=>{const host=root.querySelector('#to-local-host').value.trim(),port=root.querySelector('#to-local-port').value;if(!host||!(/^\d+$/.test(port))||+port<1||+port>65535){toast('请输入主机和 1–65535 的有效端口');return;}state.localHost=host;state.localPort=port;state.localProtocol=root.querySelector('#to-local-protocol').value;persist();toast('本机代理地址已保存');},
    'test-local':()=>{log(state.scenario==='proxy-fail'?'error':'success','代理',state.scenario==='proxy-fail'?'本机代理端口不可达。':'本机代理端口连通检查通过。');toast(state.scenario==='proxy-fail'?'检测失败：代理端口不可达（演示）':'本机代理连通检查通过（演示）');},
    'grant-permission':()=>{state.authorized=true;state.scenario='normal';closeModal();startConnection();},
    'proxy-next':()=>{current().proxy=!current().proxy;closeModal();render();persist();toast('已保存，下次连接生效');},
    'proxy-now':()=>{current().proxy=!current().proxy;applyProxy();},
    'apply-proxy':applyProxy,'retry-proxy':applyProxy,'retry':requestConnect,
    'view-logs':()=>switchPage('logs'),'export-logs':()=>showModal('export-logs'),
    'confirm-switch':()=>{disconnect(false);startConnection();},
    'confirm-reconnect':()=>{disconnect(false);startConnection();},
    'menubar':()=>showModal('menubar'),'menu-connect':el=>{state.selected=el.dataset.id;state.page='tunnel';closeModal();requestConnect();render();},
    'pause-demand':()=>{state.demandBlocked=true;closeModal();toast('已暂停按需连接，手动连接仍可使用');},
    'demand-trigger':()=>{if(state.demandBlocked){state.demandBlocked=false;toast('按需连接已恢复');}log('info','隧道','按需连接条件已满足，自动发起连接。');requestConnect();},
    'network-change':()=>{
      if(!state.active||busy())return;state.phase='reasserting';const token=++runToken;
      log('info','隧道','检测到 Wi-Fi 网络变化，正在更新隧道。');render();
      setTimeout(()=>{if(token!==runToken)return;state.phase='connected';if(state.appliedProxy)log('success','代理','已为新的网络会话重新应用代理配置。');log('success','隧道','网络恢复，连通检查通过。');render();persist();toast('网络已恢复，隧道和代理设置已重新确认');},1100);
    },
    'about':()=>showModal('about')
  };
  root.addEventListener('click', event=>{
    const action=event.target.closest('[data-action]');
    if(action&&!action.disabled){actions[action.dataset.action]?.(action);return;}
    const tunnel=event.target.closest('[data-tunnel]');
    if(tunnel){state.selected=tunnel.dataset.tunnel;state.page='tunnel';state.tab='overview';state.showKey=false;render();persist();return;}
    const page=event.target.closest('[data-page]');
    if(page){switchPage(page.dataset.page);return;}
    const tab=event.target.closest('[data-tab]');
    if(tab){state.tab=tab.dataset.tab;render();persist();return;}
    const node=event.target.closest('[data-node]');
    if(node){state.node=node.dataset.node;render();persist();toast('已切换代理节点');return;}
    const editor=event.target.closest('[data-editor]');
    if(editor){preserveEditor();state.editorMode=editor.dataset.editor;renderSheet();icons();}
  });
  root.addEventListener('change',event=>{
    const el=event.target,p=current();
    if(el.id==='to-scenario'){
      state.scenario=el.value;if(el.value==='first-run')state.authorized=false;
      if(state.phase==='idle')state.failure=null;
      render();persist();return;
    }
    if(el.dataset.toggle){
      const key=el.dataset.toggle;
      if(key==='proxy'){
        if(state.active===p.id&&state.phase==='connected'){el.checked=p.proxy;showModal('proxy-change');return;}
        p.proxy=el.checked;
      }else if(key==='ondemand')p.ondemand=el.checked;
      else state[key]=el.checked;
      render();persist();return;
    }
    if(el.dataset.sourceRadio!==undefined){p.source=el.value;render();persist();return;}
    if(el.dataset.field){
      const key=el.dataset.field;
      if(['source','failure','ssidMode'].includes(key))p[key]=el.value;
      else state[key]=el.value;
      render();persist();return;
    }
    if(el.dataset.setting){p[el.dataset.setting]=el.type==='checkbox'?el.checked:el.value;persist();}
  });
  root.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&state.modal){event.preventDefault();actions['close-modal']();}
    if(event.key==='Tab'&&state.modal){
      const items=[...sheetHost.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled)')];
      const first=items[0],last=items[items.length-1];
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
    }
    if((event.metaKey||event.ctrlKey)&&event.key==='s'&&state.modal==='edit'){event.preventDefault();saveEditor();}
  });
  render();
  if(globalThis.Tweak){
    const design={compact:false,roundness:12};
    const tweaks=new Tweak({container:root,onChange:()=>{state.density=design.compact?'compact':'comfortable';state.roundness=design.roundness;root.dataset.density=state.density;root.style.setProperty('--to-radius',state.roundness+'px');}});
    tweaks.addToggle(design,'compact',{label:'紧凑布局'});
    tweaks.addSlider(design,'roundness',{label:'内容圆角',min:6,max:16,step:2,unit:'px'});
  }
})();
</script>
</body></html>
